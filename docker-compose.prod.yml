services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
      - image_cache:/app/.next/cache
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3000'

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: closets
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d closets']
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
      - uploads:/srv/uploads:ro
    command:
      - sh
      - -c
      - |
        apk add --no-cache openssl >/dev/null 2>&1
        rm -f /etc/nginx/conf.d/default.conf
        if [ ! -f "/etc/letsencrypt/live/$$DOMAIN/fullchain.pem" ]; then
          mkdir -p "/etc/letsencrypt/live/$$DOMAIN"
          openssl req -x509 -nodes -newkey rsa:2048 -days 30 -subj "/CN=$$DOMAIN" \
            -keyout "/etc/letsencrypt/live/$$DOMAIN/privkey.pem" \
            -out "/etc/letsencrypt/live/$$DOMAIN/fullchain.pem"
        fi
        /docker-entrypoint.sh nginx -g 'daemon off;'
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint:
      - sh
      - -c
      - |
        trap exit TERM
        while true; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 12h & wait $${!}
        done

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./backups:/backups
      - uploads:/srv/uploads:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          pg_dump -h postgres -U postgres -d closets | gzip > "/backups/db-$$ts.sql.gz"
          tar -czf "/backups/uploads-$$ts.tar.gz" -C /srv uploads
          find /backups -name '*.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  pgdata:
  uploads:
  image_cache:
  letsencrypt:
  certbot_webroot:
